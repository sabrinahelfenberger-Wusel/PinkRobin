name: Backend CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build backend
        run: dotnet build PinkRobin.Backend.slnx -c Release
      - name: Test local development API
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet src/PinkRobin.Api/bin/Release/net10.0/PinkRobin.Api.dll --urls http://127.0.0.1:5080 --contentRoot "$PWD/src/PinkRobin.Api" >/tmp/pinkrobin-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" || true; cat /tmp/pinkrobin-backend.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5080/health/live; then break; fi
            sleep 1
          done
          python3 tests/smoke.py --development
      - name: Build container
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t pinkrobin-backend:test .
      - name: Test production container
        run: |
          docker run -d --name backend-test -p 127.0.0.1:5080:8080 pinkrobin-backend:test
          trap 'docker logs backend-test; docker rm -f backend-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5080/health/live; then break; fi
            sleep 1
          done
          python3 tests/smoke.py
      - name: Save verified main image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save pinkrobin-backend:test -o /tmp/backend-image.tar
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: verified-backend-image
          path: /tmp/backend-image.tar
          retention-days: 1

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-backend-image
          path: /tmp
      - run: docker load -i /tmp/backend-image.tar
      - name: Publish verified backend image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-backend"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag pinkrobin-backend:test "$image:sha-$GITHUB_SHA"
          docker tag pinkrobin-backend:test "$image:main"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:main"

  demo-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test combined development profile
        working-directory: backend
        run: |
          dotnet run --project src/PinkRobin.Api --launch-profile "PinkRobin Demo" >/tmp/pinkrobin-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" || true; cat /tmp/pinkrobin-demo.log' EXIT
          for attempt in $(seq 1 120); do
            curl --silent http://localhost:5080/ >/dev/null || true
            if curl --fail --silent http://localhost:4200/ >/tmp/pinkrobin-demo.html; then break; fi
            sleep 1
          done
          grep -q '<pr-root>' /tmp/pinkrobin-demo.html
          curl --fail --silent http://localhost:4200/api/v1/status | python3 -c 'import json,sys; assert json.load(sys.stdin)["service"] == "PinkRobin.Api"'
          curl --silent --dump-header /tmp/pinkrobin-demo.headers --output /dev/null http://localhost:5080/
          grep -qi 'location: http://localhost:4200/#/virtual-robin' /tmp/pinkrobin-demo.headers
          python3 -c 'import json; from pathlib import Path; c=json.loads(Path("src/PinkRobin.Api/bin/Debug/net10.0/spa.proxy.json").read_text())["SpaProxyServer"]; assert c["KeepRunning"] == "false"'
