# Daily filenames use UTC inside the container.
map $time_iso8601 $access_log_day {
    "~^(?<log_day>[0-9]{4}-[0-9]{2}-[0-9]{2})" $log_day;
}

server {
    listen 80;
    server_name _;

    # Only the Synology proxy (observed Docker gateway) may supply visitor IPs.
    # DSM overwrites X-Real-IP with the address of its incoming connection.
    set_real_ip_from 172.17.0.1;
    real_ip_header X-Real-IP;

    root /usr/share/nginx/html;
    index index.html;
    # Preserve the live console and also write the persistent daily archive.
    access_log /dev/stdout combined;
    access_log /var/log/pinkrobin/access-$access_log_day.log combined;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /version.txt {
        add_header Cache-Control "no-store" always;
    }
    # Docker DNS is resolved per request so a backend restart/IP change recovers.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $robin_backend http://pinkrobin-backend:8080;
    location = /api { return 404; }
    location /api/ {
        proxy_pass $robin_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }
    location /hubs { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
