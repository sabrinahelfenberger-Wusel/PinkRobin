server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /version.txt {
        add_header Cache-Control "no-store" always;
    }
    # API paths must not silently return the frontend before a backend exists.
    location /api { return 404; }
    location /hubs { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
