server {
    listen 80;
    server_name _;

    # Only the Synology proxy (observed Docker gateway) may supply visitor IPs.
    # DSM overwrites X-Real-IP with the address of its incoming connection.
    set_real_ip_from 172.17.0.1;
    real_ip_header X-Real-IP;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /version.txt {
        add_header Cache-Control "no-store" always;
    }
    # API paths must not silently return the frontend before a backend exists.
    location /api { return 404; }
    location /hubs { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
