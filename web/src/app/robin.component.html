<section
  class="stage"
  [class.awake]="awake()"
  [class.happy]="smiling()"
  [class.heart-eyes-active]="mood() === 'affectionate'"
  (window:pointerup)="onPointerEnd($event)"
  (window:pointercancel)="onPointerEnd($event)"
  (window:blur)="stopPetting()"
  (document:visibilitychange)="onVisibilityChange()"
  [class.heart-touched]="heartGlowing()"
  [class.blinking]="blinking()"
  [class.look-left]="look() === 'left'"
  [class.look-right]="look() === 'right'"
  aria-label="Pink Robin stellt sich vor"
>
  <div class="speech" id="speech" role="status" aria-live="polite">
    {{ speech() }}
  </div>
  <div class="robot-frame">
    <svg
      class="robot"
      viewBox="0 0 500 570"
      role="img"
      aria-labelledby="robot-title robot-description"
    >
      <title id="robot-title">Pink Robin</title>
      <desc id="robot-description">
        Ein cremefarbener kleiner Roboter mit grossen Augen, rosa Wangen und
        einem Herz auf der Brust. {{ state() }}.
      </desc>
      <defs>
        <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#fff8ee" />
          <stop offset=".5" stop-color="#e8dcd0" />
          <stop offset="1" stop-color="#bcada3" />
        </linearGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
          <stop stop-color="#fffaf2" />
          <stop offset="1" stop-color="#d5bfb0" />
        </linearGradient>
        <radialGradient id="screen" cx=".65" cy=".1" r=".95">
          <stop stop-color="#303033" />
          <stop offset=".65" stop-color="#101114" />
          <stop offset="1" stop-color="#060709" />
        </radialGradient>
        <radialGradient id="heart">
          <stop stop-color="#fff8fd" />
          <stop offset=".65" stop-color="#ffbad9" />
          <stop offset="1" stop-color="#ff5c9a" />
        </radialGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="6" /></filter>
        <radialGradient id="shadow">
          <stop stop-color="#000" stop-opacity=".5" />
          <stop offset="1" stop-color="#000" stop-opacity="0" />
        </radialGradient>
      </defs>
      <ellipse cx="250" cy="536" rx="170" ry="23" fill="url(#shadow)" />
      <rect x="183" y="495" width="53" height="35" rx="17" fill="#242326" />
      <rect x="270" y="495" width="53" height="35" rx="17" fill="#242326" />
      <rect x="217" y="312" width="66" height="53" rx="20" fill="#18191b" />
      <path d="M220 329h60M220 343h60" stroke="#363537" stroke-width="5" />
      <g fill="url(#shell)" stroke="#b9aaa0" stroke-width="2">
        <path
          d="M156 378Q136 366 123 390L105 452Q99 477 119 483Q142 490 150 462L171 402Z"
        />
        <path
          d="M344 378Q364 366 377 390L395 452Q401 477 381 483Q358 490 350 462L329 402Z"
        />
        <path
          d="M179 355Q250 338 321 355Q346 363 352 409L361 481Q360 511 333 514H167Q140 511 139 481L148 409Q154 363 179 355Z"
        />
      </g>
      <rect
        x="184"
        y="377"
        width="132"
        height="113"
        rx="24"
        fill="url(#rim)"
        stroke="#b8a49a"
        stroke-width="2"
      />
      <path
        d="M250 466C230 450 204 433 219 413C232 398 248 413 250 418C255 405 273 400 283 413C299 434 273 451 250 466Z"
        class="heart-glow"
        fill="#ff5c9a"
        opacity=".5"
        filter="url(#glow)"
      />
      <path
        d="M250 466C230 450 204 433 219 413C232 398 248 413 250 418C255 405 273 400 283 413C299 434 273 451 250 466Z"
        class="heart-mark"
        fill="url(#heart)"
        stroke="#ffe4f0"
        stroke-width="2"
      />
      <rect
        x="58"
        y="147"
        width="48"
        height="129"
        rx="24"
        fill="url(#shell)"
        stroke="#a89b95"
        stroke-width="2"
      />
      <rect
        x="394"
        y="147"
        width="48"
        height="129"
        rx="24"
        fill="url(#shell)"
        stroke="#a89b95"
        stroke-width="2"
      />
      <rect
        x="66"
        y="168"
        width="29"
        height="85"
        rx="15"
        fill="#655f60"
        stroke="#ff84b0"
        stroke-width="3"
      />
      <rect
        x="405"
        y="168"
        width="29"
        height="85"
        rx="15"
        fill="#655f60"
        stroke="#ff84b0"
        stroke-width="3"
      />
      <rect
        x="87"
        y="67"
        width="326"
        height="266"
        rx="79"
        fill="url(#shell)"
        stroke="#a9958b"
        stroke-width="2"
      />
      <rect x="108" y="88" width="284" height="224" rx="53" fill="url(#rim)" />
      <rect
        x="119"
        y="99"
        width="262"
        height="202"
        rx="43"
        fill="url(#screen)"
        stroke="#8e7c72"
        stroke-width="3"
      />
      <path
        d="M142 118Q245 103 351 120"
        fill="none"
        stroke="#fff"
        stroke-opacity=".07"
        stroke-width="8"
        stroke-linecap="round"
      />
      <g class="eyes curious-eyes" id="eyes">
        <g class="eye eye-left">
          <ellipse cx="191" cy="203" rx="32" ry="41" fill="#fff4f7" />
          <g class="pupil">
            <ellipse cx="196" cy="207" rx="23" ry="32" fill="#08090c" />
            <ellipse cx="201" cy="188" rx="9" ry="11" fill="white" />
            <circle cx="185" cy="223" r="4" fill="#ffbad9" />
            <circle cx="209" cy="222" r="3" fill="white" />
          </g>
        </g>
        <g class="eye eye-right">
          <ellipse cx="309" cy="203" rx="32" ry="41" fill="#fff4f7" />
          <g class="pupil">
            <ellipse cx="304" cy="207" rx="23" ry="32" fill="#08090c" />
            <ellipse cx="299" cy="188" rx="9" ry="11" fill="white" />
            <circle cx="315" cy="223" r="4" fill="#ffbad9" />
            <circle cx="291" cy="222" r="3" fill="white" />
          </g>
        </g>
      </g>
      <g
        class="eyes happy-eyes"
        fill="none"
        stroke="#fff4f7"
        stroke-width="8"
        stroke-linecap="round"
      >
        <g class="eye"><path d="M162 209Q191 167 220 209" /></g>
        <g class="eye"><path d="M280 209Q309 167 338 209" /></g>
      </g>
      <g
        class="eyes heart-eyes"
        fill="url(#heart)"
        stroke="#ffe4f0"
        stroke-width="2"
      >
        <g class="eye">
          <path
            d="M191 229C174 216 150 199 162 183C173 170 187 180 191 190C196 178 210 172 220 184C233 201 211 219 191 229Z"
          />
        </g>
        <g class="eye">
          <path
            d="M309 229C292 216 268 199 280 183C291 170 305 180 309 190C314 178 328 172 338 184C351 201 329 219 309 229Z"
          />
        </g>
      </g>
      <g class="closed-eyes">
        <path
          d="M169 207Q191 221 213 207M287 207Q309 221 331 207"
          fill="none"
          stroke="#fff4f7"
          stroke-width="6"
          stroke-linecap="round"
        />
      </g>
      <path
        [attr.d]="
          smiling() ? 'M224 239Q250 281 276 239' : 'M236 240Q250 266 264 240'
        "
        fill="none"
        stroke="#ff5c9a"
        stroke-width="5"
        stroke-linecap="round"
      />
      <g stroke="#ff75aa" stroke-width="5" stroke-linecap="round">
        <path d="M158 249l-4 4m15-4-4 4m173-4-4 4m15-4-4 4" />
      </g>
    </svg>
    <button
      class="head-button"
      type="button"
      aria-label="Robin am Kopf streicheln"
      [attr.aria-pressed]="petting()"
      aria-describedby="heart-hint"
      (pointerdown)="onHeadPointerDown($event)"
      (pointermove)="onHeadPointerMove($event)"
      (pointerleave)="stopPetting()"
      (lostpointercapture)="stopPetting()"
      (blur)="stopPetting()"
      (keydown)="onHeadKeyDown($event)"
      (keyup)="onHeadKeyUp($event)"
    ></button>
    <button
      class="heart-button"
      type="button"
      aria-label="Robins Herz berühren"
      aria-describedby="heart-hint"
      (click)="touchHeart()"
    ></button>
  </div>
  <p class="heart-hint" id="heart-hint">
    Berühre mein Herz oder streichle meinen Kopf. ♡
  </p>
  <p class="stage-caption">
    <span class="status-dot"></span><span id="state">{{ state() }}</span
    ><span class="version">Virtual Robin · 0.1</span>
  </p>
</section>
